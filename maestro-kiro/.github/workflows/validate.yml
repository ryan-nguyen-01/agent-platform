name: validate

on:
  push:
  pull_request:

jobs:
  kiro-json:
    name: Kiểm tra JSON .kiro (hooks + settings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json, glob, sys
          files = sorted(glob.glob('.kiro/hooks/*.kiro.hook') + glob.glob('.kiro/settings/*.json'))
          if not files:
              print('Không tìm thấy file JSON .kiro'); sys.exit(1)
          bad = 0
          for f in files:
              try:
                  json.load(open(f)); print('ok  ', f)
              except Exception as e:
                  print('LỖI', f, '->', e); bad = 1
          sys.exit(bad)
          PY

  kiro-skills:
    name: Kiểm tra skills theo chuẩn Kiro Agent Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill format
        run: |
          python3 - <<'PY'
          # Chuẩn Kiro (kiro.dev/docs/skills): frontmatter chỉ gồm name (= tên thư mục,
          # a-z0-9-, <=64), description (<=1024), license, compatibility, metadata.
          # Layout: SKILL.md + LICENSE* + scripts/ + references/ + assets/.
          import os, re, sys
          ROOT = '.kiro/skills'
          ALLOWED_KEYS = {'name', 'description', 'license', 'compatibility', 'metadata'}
          STD_DIRS = {'scripts', 'references', 'assets'}
          bad = 0
          def err(skill, msg):
              global bad
              print(f'LỖI {skill}: {msg}'); bad = 1
          skills = [d for d in sorted(os.listdir(ROOT))
                    if os.path.isdir(os.path.join(ROOT, d)) and not d.startswith('.')]
          if not skills:
              print('Không tìm thấy skill nào'); sys.exit(1)
          for d in skills:
              p = os.path.join(ROOT, d, 'SKILL.md')
              if not os.path.exists(p):
                  err(d, 'thiếu SKILL.md'); continue
              text = open(p, encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              if not m:
                  err(d, 'thiếu frontmatter'); continue
              fm = m.group(1)
              for line in fm.split('\n'):
                  mk = re.match(r'^([A-Za-z][\w-]*):', line)
                  if mk and mk.group(1) not in ALLOWED_KEYS:
                      err(d, f'key frontmatter ngoài chuẩn: {mk.group(1)}')
              name = re.search(r'^name:\s*(.+)$', fm, re.M)
              if not name or name.group(1).strip().strip('"') != d:
                  err(d, 'name phải trùng tên thư mục')
              elif not re.match(r'^[a-z0-9-]{1,64}$', name.group(1).strip().strip('"')):
                  err(d, 'name chỉ gồm a-z, 0-9, gạch nối, tối đa 64 ký tự')
              desc = re.search(r'^description:\s*(.+)$', fm, re.M)
              if not desc:
                  err(d, 'thiếu description')
              elif len(desc.group(1)) > 1024:
                  err(d, f'description quá 1024 ký tự ({len(desc.group(1))})')
              for entry in os.listdir(os.path.join(ROOT, d)):
                  full = os.path.join(ROOT, d, entry)
                  if os.path.isdir(full) and entry not in STD_DIRS:
                      err(d, f'thư mục ngoài chuẩn: {entry}/ (chỉ scripts/, references/, assets/)')
                  if os.path.isfile(full) and entry != 'SKILL.md' and not entry.startswith('LICENSE'):
                      err(d, f'file ngoài chuẩn ở gốc skill: {entry}')
          print(f'{len(skills)} skills đã kiểm tra')
          sys.exit(bad)
          PY
      - name: CATALOG.md khớp frontmatter (file sinh tự động)
        run: python3 scripts/build-skill-catalog.py --check

  markdownlint:
    name: Markdownlint (README + CONTRIBUTING)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            CONTRIBUTING.md
